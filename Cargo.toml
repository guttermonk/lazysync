[package]
name = "lazysync"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Dual-pane terminal file manager and sync tool with vim keys and a review-before-you-overwrite confirmation window"
license = "MIT OR Apache-2.0"
authors = ["guttermonk"]
repository = "https://github.com/guttermonk/lazysync"
homepage = "https://github.com/guttermonk/lazysync"
readme = "README.md"
keywords = ["tui", "ratatui", "sync", "sftp", "rsync"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/docs", "/assets", "/.github", "/flake.nix", "/flake.lock", "/package.nix"]

[dependencies]
# TUI. crossterm is reached through `ratatui::crossterm` rather than declared
# here: ratatui-crossterm can build against either 0.28 or 0.29, and a second
# direct dependency could resolve to the other one, at which point KeyEvent
# from the re-export and KeyEvent from our own dep are different types.
ratatui = "0.30"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Config, bookmarks, sync profiles, themes
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# The bisync state snapshot, and only that. Not TOML like everything else
# above, for two reasons: the snapshot is a machine-written index that can run
# to a table per file over a six-figure tree, which TOML is a poor fit for in
# both size and parse time; and its keys are arbitrary Unix paths, which may
# contain tabs and newlines. JSON escapes those correctly, where a
# line-oriented format of our own would need its own escaping scheme -- and a
# snapshot key that round-trips wrongly means a sync misreading a path as
# deleted.
serde_json = "1.0"

# XDG paths
dirs = "5.0"

# Errors
anyhow = "1.0"
thiserror = "2.0"

# Logging. The file sink is not optional: anything written to stderr while
# ratatui holds the alternate screen corrupts the display.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Timestamps on both sides of every sync row
chrono = { version = "0.4", features = ["serde"] }

# Protocol backends. The remotefs family is what termscp uses, and it is
# blocking -- see the note on `Vfs` in docs/PLAN.md about why that is the right
# shape here rather than an async trait.
remotefs = "1.0.1"
remotefs-ssh = "1.1.0"

# Read ~/.ssh/config, so `lazysync sftp://myhost/` honours the Host block you
# already wrote rather than making you restate hostname, user, port and key.
ssh2-config = "0.9.0"

# Host key verification, which remotefs-ssh's libssh2 backend does not do:
# nothing in it consults known_hosts. Used directly for a pre-flight handshake
# that checks the key before any credential is sent. See vfs::hostkey.
ssh2 = "0.9"
remotefs-ftp = { version = "1.0.0", features = ["rustls-aws-lc-rs"] }

# notify, the checksum crates and the rsync/rclone executors arrive with the
# phases that use them -- see docs/PLAN.md.

# Password storage. Opt-in per bookmark; key and agent auth are preferred and
# need no keyring entry at all.
#
# The backend is per-platform rather than one feature set everywhere: the
# Secret Service protocol only exists on Linux, and asking for it on macOS
# would both fail to build and be the wrong store. `sync-secret-service` (not
# the async one) because lazysync has no async runtime -- see docs/PLAN.md.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.14"

# Set a file's mtime in tests. Comparison rules turn on timestamps, so a test
# that writes a file and compares it "now" asserts on how fast it ran rather
# than on the rule.
filetime = "0.2"

[[bin]]
name = "lazysync"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
debug = true
opt-level = 0
