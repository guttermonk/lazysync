version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Patch bumps across a dozen crates are noise; group them into one PR and
    # keep separate PRs for the ones worth reading.
    groups:
      patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
