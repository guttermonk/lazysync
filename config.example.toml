# lazysync configuration
#
# Copy to $XDG_CONFIG_HOME/lazysync/config.toml. Every value below is the
# default, so an empty file behaves identically to this one.
#
# Bookmarks live in their own file (bookmarks.toml) because lazysync writes to
# them from the UI, and round-tripping a hand-commented config through a
# serializer would eat your comments.
#
# Options marked NOT YET are parsed and validated but not acted on. They are
# accepted rather than rejected so a config written for a later version still
# loads -- but nothing pretends they work, and where one would change what a
# comparison means, the confirmation window reports the rule it actually
# applied rather than the one requested.

# ─── General ─────────────────────────────────────────────────────────────────

# Which pane has focus at startup: "local" or "remote".
default_pane = "local"

# Show dotfiles. Toggled live with `.`.
show_hidden = false

# "name" | "size" | "modified" | "extension", optionally "-name" to reverse.
sort = "name"

# Directories before files regardless of sort key.
dirs_first = true

# Computing a directory's recursive size costs one listing per subdirectory,
# which over SFTP is slow enough to be felt. Off means directories show "-".
dir_sizes = false

# How long a chord waits before giving up and firing its *shorter* binding
# instead -- `d` bound alongside `dd`, where lazysync has to decide how long
# to wait before concluding you meant the short one.
#
# It does not put a clock on typing a chord. None of the default chords has a
# shorter binding to fall back on, so with a stock keymap nothing here ever
# fires: `s` waits for its second key as long as you take, and the way out of
# a chord you did not mean to start is your cancel key (esc, or ctrl+c).
chord_timeout_ms = 500

# Report mouse clicks and the wheel to lazysync. A click selects -- a file, a
# connection, a form field, a section of a plan, a button -- and a double
# click opens it: the same action the keyboard has, never a new one.
#
# Worth knowing what it costs: while lazysync is running the terminal hands it
# the mouse, so dragging to select text selects nothing. Most terminals keep
# their own selection on shift+drag. Set this to false to get it back
# unconditionally, at which point lazysync is keyboard-only again.
mouse = true

# ─── Connections ─────────────────────────────────────────────────────────────

[connection]
# Seconds between liveness pings on an idle remote pane; 0 turns it off.
#
# An SFTP or FTP server closes an idle session on its own schedule, and there
# is usually a middlebox between you and it with opinions of its own. Without
# this, lazysync holds a socket that is already gone and finds out at your
# next keystroke.
#
# 60 is comfortably inside the usual 120-300 second idle timeouts, and one
# `stat` a minute is nothing next to a directory listing. Nothing is sent
# while both panes are local.
keepalive_secs = 60

# Re-establish a dropped connection instead of reporting it.
#
# Only ever silent where the credential can be had again without asking:
# agent auth, key auth, or a password the connection opted to keep in the
# keyring. A password typed once and deliberately not stored cannot be
# replayed, and a password box appearing from a timer while you were reading
# something else is worse than a message -- so that case says so instead.
#
# The pane keeps its directory, cursor and marks across a reconnect.
auto_reconnect = true

# ─── Editor ──────────────────────────────────────────────────────────────────

[editor]
# What `e` runs, overriding $VISUAL and $EDITOR.
#
# A list rather than a string, like `hide_command`: splitting one into a
# program and its arguments takes a shell, and lazysync has none to offer.
#
# Empty means the environment decides -- $VISUAL first, then $EDITOR, each
# split on whitespace, since that is the convention those variables already
# follow (`code -w`, `nvim -u NONE`). Set this when your editor's *path*
# contains a space, or to use a different one here than everywhere else.
#
#   command = ["nvim"]
command = []

# Refuse to open anything larger than this, in bytes. 0 disables.
#
# Editing a remote file downloads it first, so without a ceiling `e` on a
# 4 GB dump is a long silent wait ending in an editor that cannot open it
# either. The refusal happens before the transfer rather than after.
max_bytes = 10485760   # 10 MiB

# ─── Synchronized browsing ───────────────────────────────────────────────────

[sync_browse]
# Start with synchronized browsing on.
enabled = false

# Which pane's navigation drives the other.
#   "focused" -- whichever pane you are in leads
#   "local" / "remote" -- that pane always leads
leader = "focused"

# What the follower pane does when the counterpart directory does not exist.
# This is the case where a sparse local checkout meets a full remote.
#   "ghost"  -- show "(does not exist on this side)" but remember the virtual
#               path, so going back up re-couples the panes. No permanent
#               desync. Recommended.
#   "stay"   -- hold position and show a desynced badge in the status bar
#   "create" -- create the directory
#   "ask"    -- prompt each time
on_missing = "ghost"

# Merge both panes' listings into one logical set, marking each row L
# (local only), R (remote only) or LR (both). Makes a remote with far more
# entries than your local tree navigable. Toggled live with `u`.
union_view = false

# ─── zide integration ────────────────────────────────────────────────────────

[zide]
# When lazysync starts in a directory that matches a bookmark's local_path,
# open that bookmark instead of showing the bookmark list.
auto_open_bookmark = true

# How the working directory is matched against bookmark local paths.
#   "ancestor" -- exact match first, then the deepest local_path that is a
#                 prefix of the working directory. Opening the popup in
#                 ~/proj/src/api picks the ~/proj bookmark and pre-positions
#                 the remote pane at src/api.
#   "exact"    -- only an exact match counts
#   "off"      -- same as auto_open_bookmark = false
match = "ancestor"

# What the `Hide` action runs: the command that puts the popup away and leaves
# lazysync running behind it, connection and all. Quitting is what closes a
# connection; this is for wanting the terminal back for a minute.
#
# Empty by default, because the only program that can hide this window is the
# one that opened it, and lazysync does not know what that was. Nothing is
# detected or guessed -- name the command and it is used, leave it empty and
# the `Hide` key says there is nothing to hide with.
#
# A list, not a string: splitting a string into a program and its arguments
# takes a shell, and lazysync has no shell to offer.
#
#   hide_command = ["zellij", "action", "hide-floating-panes"]
#
# It is waited for and its output is captured, so it has to return promptly --
# anything it printed would otherwise land on top of the TUI.
#
# `Hide` has no key until you give it one, since this is empty by default and
# a key bound to a no-op reads as a broken feature rather than an unused one:
#
#   [keys.browser]
#   set = [["Hide", "esc"]]
#
# Bringing the pane back is the host's job, not lazysync's. In zellij that is
# ToggleFloatingPanes, Alt+f by default -- and note that a keybind which *runs*
# lazysync opens a second one rather than revealing the hidden pane.
hide_command = []

# ─── Comparison ──────────────────────────────────────────────────────────────

[compare]
# How two files are judged same-or-different when building a plan.
#   "size_mtime" -- fast, and right nearly always
#   "size_only"  -- for remotes with no usable timestamp at all
#   "checksum"   -- NOT YET: nothing hashes anything, so this degrades to
#                   "size_mtime". It is accepted rather than rejected so a
#                   config written for a later version still loads -- but the
#                   window reports the rule it *actually* used, because that
#                   header is a claim about what was checked.
#
# "size_mtime" falls back to "size_only" by itself where a timestamp
# comparison could not mean anything: when either side does not report an
# mtime (S3), or when the destination cannot be made to *keep* the source's
# (FTP, whose MFMT is not in the base protocol). In that second case every
# uploaded file carries the time it was uploaded, so comparing timestamps
# would mark the whole tree changed on every run. The confirmation window
# always shows the rule it actually used, and such rows read "same size, times
# not kept" rather than claiming a check that was not made.
method = "size_mtime"

# Timestamps that differ by less than this are treated as equal. Needed
# because filesystems and protocols disagree about granularity: FAT stores
# 2-second resolution, some SFTP servers 1 second, S3 has no mtime at all.
# Setting this to 0 is the most common cause of "why does it want to re-copy
# everything".
mtime_tolerance_secs = 2

# Re-check rows the fast method calls ambiguous (equal size, equal mtime, but
# a hash is available cheaply from the provider) using that hash.
use_provider_hash = true

# ─── Transfers ───────────────────────────────────────────────────────────────

[transfer]
# Concurrent file transfers per job. NOT YET: transfers are sequential.
# Parallelism within one SSH session needs multiple channels.
parallel = 4

# KiB/s, 0 for unlimited. NOT YET.
bandwidth_limit = 0

# Write to `<name>.lazysync-part` and rename on completion, so an interrupted
# transfer never leaves a truncated file where the real one was.
partial_suffix = ".lazysync-part"

# Resume an interrupted transfer from the partial file where the protocol
# supports ranged writes.
resume = true

# Preserve mtime, and mode where the protocol allows it. The confirmation
# window says so explicitly when it cannot. Both are always on today; the
# flags exist to turn them off and are NOT YET honoured.
preserve_mtime = true
preserve_mode = true

# ─── Safety ──────────────────────────────────────────────────────────────────

[safety]
# Where deletions go in mirror mode. Set to "" for real deletion.
#   "<path>"           -- a backup directory, relative to the sync root
#   ""                 -- permanent deletion, confirmed a second time
# ("trash" for the XDG trash is NOT YET implemented.)
backup_dir = ".lazysync-backup"

# Abort the plan rather than show it if more than this fraction of the
# destination would be deleted. The guard against a mistyped sync root.
max_delete_fraction = 0.25

# Abort if more than this many files would be deleted. 0 disables.
max_delete_files = 0

# Require a second confirmation when a plan would touch anything outside the
# sync root (reachable through symlinks). NOT YET: symlinks are not
# transferred at all, so nothing can currently escape the root this way.
confirm_outside_root = true

# Suffix for the losing side of a bisync conflict resolved with "keep both"
# (`B` in the confirmation window). The winner lands at the original name on
# *both* sides and the copy it displaced is renamed to `<name><suffix>` next to
# itself, so nothing is lost and the two sides end up agreeing.
#
# Leaving each side its own version under the original name would be the
# obvious reading of "keep both" and is the wrong one: the sides would stay
# different and raise the same conflict on every later run, for ever.
#
# Set to "" to make "keep both" behave as "keep local" and discard the
# displaced copy.
conflict_suffix = ".lazysync-conflict"

# ─── Confirmation window ─────────────────────────────────────────────────────

[confirm]
# Start with the "identical, skipped" section folded.
fold_skipped = true

# Highlight in red when the destination is newer than the source -- i.e. you
# are about to overwrite newer data with older.
warn_dest_newer = true

# Sections to show even when empty, so a missing section is never mistaken for
# a missing check. Create, Overwrite and Delete are always shown; this list is
# NOT YET read.
always_show = ["create", "overwrite", "delete", "conflict"]

# ─── Theme ───────────────────────────────────────────────────────────────────

[theme]
# "terminal" follows your terminal's own palette, so a transparent or themed
# terminal shows through. Also: "catppuccin-mocha", "gruvbox-dark", "nord".
preset = "terminal"

# Individual colours can be overridden on top of the preset. Values are either
# hex ("#89b4fa" or "0x89b4fa") or an ANSI name: reset, black, red, green,
# yellow, blue, magenta, cyan, gray, dark-gray, and bright-red through
# bright-white.
#
# Slots: fg, bg, dim, border, border_focused, dir, file, symlink, executable,
# ghost, marked, cursor_fg, cursor_bg, status_fg, status_bg, accent, ok, warn,
# danger.
#
# [theme.colors]
# border_focused = "#fabd2f"
# ghost = "dark-gray"      # one-sided rows in union view, and absent panes
# danger = "bright-red"    # overwriting newer data with older

# ─── Keybindings ─────────────────────────────────────────────────────────────
#
# Each mode has its own keymap, because `d` is delete in the browser and a
# literal `d` in a text field.
#
# Four tables per mode, applied in this order:
#
#     base     start from nothing but this -- replaces the defaults entirely
#     set      these ACTIONS get exactly these keys, losing the ones they had
#     extra    these KEYS get these actions, on top of whatever is there
#     unbind   these keys do nothing; applied last, so nothing reinstates them
#
# `set` vs `extra` is the distinction that matters:
#
#     set   = [["MoveDown", "e"]]   -- "move down is on e now"; j stops working
#     extra = [["MoveDown", "e"]]   -- "e also moves down";     j still works
#
# `set` replaces an action's other keys, so list every one you want to keep --
# except the arrows, which it never retires. Use `unbind = ["down"]` if you
# really want an arrow gone. `unbind` is prefix-based: unbinding "s"
# also removes the "sp"/"sl" chords, or "s" would still be swallowed while
# lazysync waited for the rest of a chord.
#
# Run `lazysync keys` to see what a config resolves to. It also names any
# action that ended up with no key at all -- which `base`, `set`, `extra` and
# `unbind` can all cause, and which is otherwise silent.
#
# A key combo is a single key, a key with modifiers, or an array of either
# for a chord:
#     "S"                      -- plain key
#     { key = "d", mod = ["Ctrl"] }
#     ["g", "g"]               -- chord
#
# Modifiers: "Alt", "Ctrl", "Shift", "Super"
#
# Modes: bookmarks, browser, confirm, form, prompt, help, queue, log

[keys.bookmarks]
# extra = [
#     ["OpenItem",   "enter"],
#     ["NewItem",    "n"],
#     ["EditItem",   "e"],
#     ["DeleteItem", ["d", "d"]],
# ]

[keys.browser]
# Move a few actions onto your own keys, retiring the defaults for them and
# leaving every other binding untouched:
# set = [
#     ["MoveDown",   "e"],
#     ["MoveUp",     "i"],
#     ["ParentDir",  "n"],
#     ["EnterDir",   "o"],
#     ["EnterDir",   "enter"],   # a SECOND entry, not ["o","enter"] --
#                                # an array means a CHORD: o then Enter
# ]
#
# Free a key for a terminal multiplexer -- zellij or tmux closing a popup on
# Esc only gets Esc if lazysync is not sitting on it:
# unbind = ["esc"]
#
# extra = [
#     ["ToggleSyncBrowse", "S"],
#     ["ToggleUnionView",  "u"],
#     ["SyncPush",         ["s", "p"]],
#     ["SyncPull",         ["s", "l"]],
#     ["Delete",           ["d", "d"]],
#     ["Quit",             ["Z", "Z"]],
# ]

[keys.confirm]
# extra = [
#     ["Apply",     "y"],
#     ["Cancel",    "n"],
#     ["ToggleRow", "Space"],
#     ["Checksum",  "c"],
#     ["DiffRow",   "D"],
# ]

# In a form, printable keys are literal text, so only keys that cannot be
# typed are bound. That is why choice fields cycle with the arrow keys rather
# than with h/l or space: those have to stay available for typing a path.
[keys.form]
# extra = [
#     ["NextChoice", "right"],
#     ["PrevChoice", "left"],
#     ["Submit",     "enter"],
# ]

# The transfer progress screen.
[keys.queue]
# extra = [
#     ["TogglePause", "p"],
#     ["Cancel",      "esc"],
# ]

# ─── Sync profiles ───────────────────────────────────────────────────────────
#
# Named, reusable bundles of sync options, referenced by bookmarks and by
# `lazysync sync <profile>`. Without these, every run means re-entering the
# same options.

[profiles.deploy]
# "push" | "pull" | "mirror-push" | "mirror-pull" | "bisync"
#
# "bisync" is interactive-only: `lazysync sync` refuses a bisync profile
# rather than settling conflicts on its own. A cron job that silently picks a
# side is one that works until the day it matters.
mode = "push"

# What moves the bytes: "auto" | "native" | "rsync" | "rclone".
#
# "auto" means the native engine. That is not what the name suggests, so here
# is why: a delegated transfer gives up three things only lazysync's own write
# path provides. The destination is re-checked immediately before it is
# written, so a file that changed after the plan was built is skipped rather
# than clobbered. Progress and cancellation are per file rather than one
# aggregate line. And a conflict resolved "keep both" has its displaced copy
# preserved.
#
# Those can be a fair trade for rsync's delta transfer on a large changed
# file. Making them silently, under a setting that promises only "the best
# available", is not -- so name the tool to get it. (Keep-both is refused even
# then: that one is data loss, not a trade.)
#
# When a tool does run it is a transport, not a planner: it is handed the
# exact list of paths the plan contains, and deletions always stay with the
# native engine so the backup directory and the delete limits keep working.
executor = "auto"

# Exclude rules, in gitignore syntax. Later rules win, so `!keep.log` after
# `*.log` means something.
#
#   name      that name at any depth, file or directory
#   name/     directories only, and everything under them
#   /name     anchored to the sync root
#   *         within one path component;  ?  one character
#   **        across separators
#   !name     re-include
#   # ...     a comment
#
# Character classes ([a-z]) are not supported. A pattern using one is an
# error rather than a literal -- a filter that silently does nothing is how
# `target/` ends up on a web server.
exclude = ["/target/", "*.log", ".git/"]

# Also read the sync root's own .gitignore, on top of `exclude`.
# Nested .gitignore files are not consulted yet.
respect_gitignore = false

# Skip the confirmation window. NOT YET read, and probably never will be:
# `watch = "auto"` is the setting that applies without asking, and `--yes` is
# the one for cron. A third way to say the same thing -- one that silently
# applies to the *interactive* path too -- would be a config line that turns
# the confirmation window off, which is the feature this program exists to
# provide.
auto_confirm = false

# A two-way profile. Run it with `sb`, or with `ss` when a bookmark names it.
#
# The pair's state lives in $XDG_STATE_HOME/lazysync/bisync/, keyed by the two
# roots, so one machine can bisync several pairs without them colliding. The
# first run of a pair never deletes anything -- with no snapshot, a file on one
# side only is as likely to be new as removed.
[profiles.notes]
mode = "bisync"
executor = "auto"
exclude = [".obsidian/workspace.json"]

# Continuously sync local changes as they happen. `sw` starts and stops it.
#   "batch" -- collect for `debounce_ms`, then show one plan
#   "auto"  -- apply without confirmation
#   "off"   -- no watching, and `sw` says so
#
# A watcher that opens a modal on every save is useless; one that never
# confirms contradicts the rest of lazysync. Both exist, and the unattended
# one is opt-in -- the audit log marks its runs `unattended`.
#
# The batch decides *when* to sync, never what: the planner walks the trees as
# usual, because syncing only the paths that fired events would miss whatever
# inotify dropped. lazysync's own partial and backup files are ignored, or a
# transfer would trigger the next sync for ever.
watch = "off"
debounce_ms = 2000
