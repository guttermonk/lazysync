# lazysync configuration
#
# Copy to $XDG_CONFIG_HOME/lazysync/config.toml. Every value below is the
# default, so an empty file behaves identically to this one.
#
# Bookmarks live in their own file (bookmarks.toml) because lazysync writes to
# them from the UI, and round-tripping a hand-commented config through a
# serializer would eat your comments.
#
# Options marked "not yet" are parsed and validated but not acted on; the
# phase that implements each is in docs/PLAN.md.

# ─── General ─────────────────────────────────────────────────────────────────

# Which pane has focus at startup: "local" or "remote".
default_pane = "local"

# Show dotfiles. Toggled live with `.`.
show_hidden = false

# "name" | "size" | "modified" | "extension", optionally "-name" to reverse.
sort = "name"

# Directories before files regardless of sort key.
dirs_first = true

# Computing a directory's recursive size costs one listing per subdirectory,
# which over SFTP is slow enough to be felt. Off means directories show "-".
dir_sizes = false

# How long a chord like `gg` or `dd` waits for its second key.
chord_timeout_ms = 500

# ─── Synchronized browsing ───────────────────────────────────────────────────

[sync_browse]
# Start with synchronized browsing on.
enabled = false

# Which pane's navigation drives the other.
#   "focused" -- whichever pane you are in leads
#   "local" / "remote" -- that pane always leads
leader = "focused"

# What the follower pane does when the counterpart directory does not exist.
# This is the case where a sparse local checkout meets a full remote.
#   "ghost"  -- show "(does not exist on this side)" but remember the virtual
#               path, so going back up re-couples the panes. No permanent
#               desync. Recommended.
#   "stay"   -- hold position and show a desynced badge in the status bar
#   "create" -- create the directory
#   "ask"    -- prompt each time
on_missing = "ghost"

# Merge both panes' listings into one logical set, marking each row L
# (local only), R (remote only) or LR (both). Makes a remote with far more
# entries than your local tree navigable. Toggled live with `u`.
union_view = false

# ─── zide integration ────────────────────────────────────────────────────────

[zide]
# When lazysync starts in a directory that matches a bookmark's local_path,
# open that bookmark instead of showing the bookmark list.
auto_open_bookmark = true

# How the working directory is matched against bookmark local paths.
#   "ancestor" -- exact match first, then the deepest local_path that is a
#                 prefix of the working directory. Opening the popup in
#                 ~/proj/src/api picks the ~/proj bookmark and pre-positions
#                 the remote pane at src/api.
#   "exact"    -- only an exact match counts
#   "off"      -- same as auto_open_bookmark = false
match = "ancestor"

# ─── Comparison ──────────────────────────────────────────────────────────────

[compare]
# How two files are judged same-or-different when building a plan.
#   "size_mtime" -- fast, and right nearly always
#   "checksum"   -- correct, and reads both files in full
#   "size_only"  -- for remotes with no usable timestamp at all
#
# "size_mtime" falls back to "size_only" by itself where a timestamp
# comparison could not mean anything: when either side does not report an
# mtime (S3), or when the destination cannot be made to *keep* the source's
# (FTP, whose MFMT is not in the base protocol). In that second case every
# uploaded file carries the time it was uploaded, so comparing timestamps
# would mark the whole tree changed on every run. The confirmation window
# always shows the rule it actually used, and such rows read "same size, times
# not kept" rather than claiming a check that was not made. Set "checksum"
# when size alone is not enough for you.
method = "size_mtime"

# Timestamps that differ by less than this are treated as equal. Needed
# because filesystems and protocols disagree about granularity: FAT stores
# 2-second resolution, some SFTP servers 1 second, S3 has no mtime at all.
# Setting this to 0 is the most common cause of "why does it want to re-copy
# everything".
mtime_tolerance_secs = 2

# Re-check rows the fast method calls ambiguous (equal size, equal mtime, but
# a hash is available cheaply from the provider) using that hash.
use_provider_hash = true

# ─── Transfers ───────────────────────────────────────────────────────────────

[transfer]
# Concurrent file transfers per job. NOT YET: transfers are sequential.
# Parallelism within one SSH session needs multiple channels.
parallel = 4

# KiB/s, 0 for unlimited. NOT YET.
bandwidth_limit = 0

# Write to `<name>.lazysync-part` and rename on completion, so an interrupted
# transfer never leaves a truncated file where the real one was.
partial_suffix = ".lazysync-part"

# Resume an interrupted transfer from the partial file where the protocol
# supports ranged writes.
resume = true

# Preserve mtime, and mode where the protocol allows it. The confirmation
# window says so explicitly when it cannot. Both are always on today; the
# flags exist to turn them off and are NOT YET honoured.
preserve_mtime = true
preserve_mode = true

# ─── Safety ──────────────────────────────────────────────────────────────────

[safety]
# Where deletions go in mirror mode. Set to "" for real deletion.
#   "<path>"           -- a backup directory, relative to the sync root
#   ""                 -- permanent deletion, confirmed a second time
# ("trash" for the XDG trash is NOT YET implemented.)
backup_dir = ".lazysync-backup"

# Abort the plan rather than show it if more than this fraction of the
# destination would be deleted. The guard against a mistyped sync root.
max_delete_fraction = 0.25

# Abort if more than this many files would be deleted. 0 disables.
max_delete_files = 0

# Require a second confirmation when a plan would touch anything outside the
# sync root (reachable through symlinks). NOT YET: symlinks are not
# transferred at all, so nothing can currently escape the root this way.
confirm_outside_root = true

# Suffix for the losing side of a bisync conflict resolved with "keep both"
# (`B` in the confirmation window). The winner lands at the original name on
# *both* sides and the copy it displaced is renamed to `<name><suffix>` next to
# itself, so nothing is lost and the two sides end up agreeing.
#
# Leaving each side its own version under the original name would be the
# obvious reading of "keep both" and is the wrong one: the sides would stay
# different and raise the same conflict on every later run, for ever.
#
# Set to "" to make "keep both" behave as "keep local" and discard the
# displaced copy.
conflict_suffix = ".lazysync-conflict"

# ─── Confirmation window ─────────────────────────────────────────────────────

[confirm]
# Start with the "identical, skipped" section folded.
fold_skipped = true

# Highlight in red when the destination is newer than the source -- i.e. you
# are about to overwrite newer data with older.
warn_dest_newer = true

# Sections to show even when empty, so a missing section is never mistaken for
# a missing check. Create, Overwrite and Delete are always shown; this list is
# NOT YET read.
always_show = ["create", "overwrite", "delete", "conflict"]

# ─── Theme ───────────────────────────────────────────────────────────────────

[theme]
# "terminal" follows your terminal's own palette, so a transparent or themed
# terminal shows through. Also: "catppuccin-mocha", "gruvbox-dark", "nord".
preset = "terminal"

# Individual colours can be overridden on top of the preset. Values are either
# hex ("#89b4fa" or "0x89b4fa") or an ANSI name: reset, black, red, green,
# yellow, blue, magenta, cyan, gray, dark-gray, and bright-red through
# bright-white.
#
# Slots: fg, bg, dim, border, border_focused, dir, file, symlink, executable,
# ghost, marked, cursor_fg, cursor_bg, status_fg, status_bg, accent, ok, warn,
# danger.
#
# [theme.colors]
# border_focused = "#fabd2f"
# ghost = "dark-gray"      # one-sided rows in union view, and absent panes
# danger = "bright-red"    # overwriting newer data with older

# ─── Keybindings ─────────────────────────────────────────────────────────────
#
# Each mode has its own keymap, because `d` is delete in the browser and a
# literal `d` in a text field.
#
# `base` replaces that mode's defaults entirely; `extra` layers on top and
# wins any collision with a base binding sharing its prefix. Run
# `lazysync keys` to see what a config actually resolves to.
#
# A key combo is a single key, a key with modifiers, or an array of either
# for a chord:
#     "S"                      -- plain key
#     { key = "d", mod = ["Ctrl"] }
#     ["g", "g"]               -- chord
#
# Modifiers: "Alt", "Ctrl", "Shift", "Super"
#
# Modes: bookmarks, browser, confirm, form, prompt, help, queue, log

[keys.bookmarks]
# extra = [
#     ["OpenItem",   "enter"],
#     ["NewItem",    "n"],
#     ["EditItem",   "e"],
#     ["DeleteItem", ["d", "d"]],
# ]

[keys.browser]
# extra = [
#     ["ToggleSyncBrowse", "S"],
#     ["ToggleUnionView",  "u"],
#     ["SyncPush",         ["s", "p"]],
#     ["SyncPull",         ["s", "l"]],
#     ["Delete",           ["d", "d"]],
#     ["Quit",             ["Z", "Z"]],
# ]

[keys.confirm]
# extra = [
#     ["Apply",     "y"],
#     ["Cancel",    "n"],
#     ["ToggleRow", "Space"],
#     ["Checksum",  "c"],
#     ["DiffRow",   "D"],
# ]

# In a form, printable keys are literal text, so only keys that cannot be
# typed are bound. That is why choice fields cycle with the arrow keys rather
# than with h/l or space: those have to stay available for typing a path.
[keys.form]
# extra = [
#     ["NextChoice", "right"],
#     ["PrevChoice", "left"],
#     ["Submit",     "enter"],
# ]

# The transfer progress screen.
[keys.queue]
# extra = [
#     ["TogglePause", "p"],
#     ["Cancel",      "esc"],
# ]

# ─── Sync profiles ───────────────────────────────────────────────────────────
#
# Named, reusable bundles of sync options, referenced by bookmarks and by
# `lazysync sync <profile>`. Without these, every run means re-entering the
# same options.

[profiles.deploy]
# "push" | "pull" | "mirror-push" | "mirror-pull" | "bisync"
#
# "bisync" is interactive-only: `lazysync sync` refuses a bisync profile
# rather than settling conflicts on its own. A cron job that silently picks a
# side is one that works until the day it matters.
mode = "push"

# "auto" picks the best available: rsync for ssh remotes when rsync exists on
# both ends, rclone when the remote is an rclone remote, native otherwise.
# "native" never shells out.
executor = "auto"

# Exclude rules, in gitignore syntax. Later rules win, so `!keep.log` after
# `*.log` means something.
#
#   name      that name at any depth, file or directory
#   name/     directories only, and everything under them
#   /name     anchored to the sync root
#   *         within one path component;  ?  one character
#   **        across separators
#   !name     re-include
#   # ...     a comment
#
# Character classes ([a-z]) are not supported. A pattern using one is an
# error rather than a literal -- a filter that silently does nothing is how
# `target/` ends up on a web server.
exclude = ["/target/", "*.log", ".git/"]

# Also read the sync root's own .gitignore, on top of `exclude`.
# Nested .gitignore files are not consulted yet.
respect_gitignore = false

# Skip the confirmation window. Only honoured by `lazysync sync --yes` and by
# watch mode; the interactive UI always shows the plan. NOT YET read: use
# --yes.
auto_confirm = false

# A two-way profile. Run it with `sb`, or with `ss` when a bookmark names it.
#
# The pair's state lives in $XDG_STATE_HOME/lazysync/bisync/, keyed by the two
# roots, so one machine can bisync several pairs without them colliding. The
# first run of a pair never deletes anything -- with no snapshot, a file on one
# side only is as likely to be new as removed.
[profiles.notes]
mode = "bisync"
executor = "auto"
exclude = [".obsidian/workspace.json"]

# Continuously push local changes as they happen. A watcher that opens a modal
# on every save is useless, so changes are batched and confirmed together.
#   "batch" -- collect for `debounce_ms`, then show one plan
#   "auto"  -- apply without confirmation
#   "off"   -- no watching
watch = "off"
debounce_ms = 2000
